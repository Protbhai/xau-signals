# All times for the user are Asia/Kolkata (IST). Internals are UTC.

[session]
tz = "Asia/Kolkata"
start = "09:00"          # inclusive
end = "15:00"            # exclusive
max_alerts_per_session = 3
cooldown_minutes = 20    # after a SENT setup alert, no new setup alert for this long. Design choice (docs/DESIGN.md), not optimised.
slot_seconds = 300       # duplicate-trigger protection: one effective run per 5-minute slot
closures_file = "config/closures.json"

[data]
# Provider for live runs; override with env XAU_PROVIDER. Decision: docs/research/data-sources.md + probe results.
#   twelvedata : XAU/USD spot, real time, needs free key (XAU_TWELVEDATA_KEY); reachable from GitHub runners
#   yahoo      : GC=F COMEX futures, ~10 min delayed, unofficial; fallback
#   binance    : XAUUSDT perp, keyless, real time; GEO-BLOCKED (HTTP 451) from US-hosted runners -> research only
provider = "twelvedata"
symbol = "XAU/USD"
bias_interval = "1h"
setup_interval = "5m"
max_candle_age_seconds = 900         # newest completed 5m candle must close within 15 min of the check
max_unexplained_gap_bars = 1
[data.symbols]
twelvedata = "XAU/USD"
yahoo = "GC=F"
binance = "XAUUSDT"


[strategy]
name = "benchmark_v1"

[strategy.benchmark_v1]
bias_sma = 20
bias_lookback_slope = 3
setup_ema = 20
atr_period = 14
touch_tolerance_atr = 0.25
expiry_bars = 6            # setup expires after this many setup-interval bars without a trigger
stale_extension_atr = 1.0  # if price is already > this many ATR beyond the trigger, do not send (stale)
invalidation_buffer_atr = 0.1

[strategy.breakout_retest_v1]
range_minutes = 90
atr_period = 14
retest_tol_atr = 0.3
expiry_bars = 6
stale_extension_atr = 1.0
invalidation_buffer_atr = 0.1
min_range_atr = 1.0

[strategy.range_rejection_v1]
bias_sma = 20
bias_lookback_slope = 3
atr_period = 14
range_band_atr = 0.75
slope_atr = 0.25
lookback_bars = 36
expiry_bars = 6
stale_extension_atr = 1.0
invalidation_buffer_atr = 0.1

[strategy.benchmark_ext_v1]
bias_sma = 20
bias_lookback_slope = 3
setup_ema = 20
atr_period = 14
touch_tolerance_atr = 0.25
expiry_bars = 6
stale_extension_atr = 1.0
invalidation_buffer_atr = 0.1
max_ext_atr = 2.0

[notify]
telegram_timeout_seconds = 15
telegram_max_retries = 2
failure_alert_after_consecutive_data_failures = 3

[state]
dir = "state"
lock_stale_seconds = 240
