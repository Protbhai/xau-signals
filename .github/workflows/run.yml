# Production runner (paper by default). One check per trigger; state and tracking
# files are committed back so the next run sees them.
#
# Triggers:
#   schedule         GitHub cron every 5 min, 03:15-09:40 UTC Mon-Fri (08:45-15:10 IST). GitHub's
#                    scheduler is known to run late/skip under load; it is the BACKUP trigger.
#   workflow_dispatch  primary trigger from an external pinger (cron-job.org) every 5 min, or manual.
# The engine's slot check makes a second trigger in the same 5-minute slot a no-op.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   XAU_TELEGRAM_BOT_TOKEN, XAU_TELEGRAM_CHAT_ID, XAU_TWELVEDATA_KEY
# Variables: XAU_MODE (paper|live, default paper), XAU_PROVIDER (default from config)
name: run
on:
  schedule:
    - cron: "15,20,25,30,35,40,45,50,55 3 * * 1-5"
    - cron: "*/5 4-8 * * 1-5"
    - cron: "0,5,10,15,20,25,30,35,40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "fetch even outside the session window"
        type: boolean
        default: false
      session_start:
        description: "TEST ONLY: override session start HH:MM IST"
        type: string
        default: ""
      session_end:
        description: "TEST ONLY: override session end HH:MM IST"
        type: string
        default: ""
concurrency:
  group: xau-run
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      XAU_TELEGRAM_BOT_TOKEN: ${{ secrets.XAU_TELEGRAM_BOT_TOKEN }}
      XAU_TELEGRAM_CHAT_ID: ${{ secrets.XAU_TELEGRAM_CHAT_ID }}
      XAU_TWELVEDATA_KEY: ${{ secrets.XAU_TWELVEDATA_KEY }}
      XAU_MODE: ${{ vars.XAU_MODE || 'paper' }}
      XAU_PROVIDER: ${{ vars.XAU_PROVIDER }}
      XAU_SESSION_START: ${{ inputs.session_start }}
      XAU_SESSION_END: ${{ inputs.session_end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e .
      - name: check
        run: |
          echo "trigger=${{ github.event_name }} start=$(date -u +%FT%TZ)"
          python -m xau_signals run ${{ inputs.force && '--force' || '' }} | tee run.out
      - name: persist state
        shell: bash
        run: |
          # This run's state.json is authoritative (one effective check per slot); the append-only
          # tracking logs are merged by union. A lost push would break at-most-once, so it fails the job.
          git config user.name "xau-bot"
          git config user.email "xau-bot@users.noreply.github.com"
          mkdir -p /tmp/ours/tracking
          cp state/state.json /tmp/ours/state.json 2>/dev/null || true
          cp data/tracking/*.jsonl /tmp/ours/tracking/ 2>/dev/null || true
          msg="state: $(date -u +%FT%TZ) ${{ github.event_name }}"
          for i in 1 2 3 4 5; do
            git add -A state/ data/tracking/ 2>/dev/null || true
            git commit -q -m "$msg" || true
            if ! git pull --rebase -q; then
              git rebase --abort 2>/dev/null || true
              git fetch -q origin main
              git reset -q --hard origin/main
              [ -f /tmp/ours/state.json ] && mkdir -p state && cp /tmp/ours/state.json state/state.json
              mkdir -p data/tracking
              for f in /tmp/ours/tracking/*.jsonl; do
                [ -f "$f" ] || continue
                b=$(basename "$f")
                if [ -f "data/tracking/$b" ]; then cat "data/tracking/$b" "$f" | awk '!seen[$0]++' > /tmp/merged && mv /tmp/merged "data/tracking/$b"; else cp "$f" "data/tracking/$b"; fi
              done
              git add -A state/ data/tracking/ 2>/dev/null || true
              git commit -q -m "$msg (merged)" || true
            fi
            if git push -q; then echo "state pushed (attempt $i)"; exit 0; fi
            sleep $((3 * i))
          done
          echo "::error::state push failed after 5 attempts; this run's alert record may be lost"
          exit 1
  outcomes:
    if: github.event_name == 'schedule' && contains(github.event.schedule, '9 * * 1-5') && startsWith(github.event.schedule, '0,5')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      XAU_TWELVEDATA_KEY: ${{ secrets.XAU_TWELVEDATA_KEY }}
      XAU_PROVIDER: ${{ vars.XAU_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e .
      - run: python -m xau_signals outcomes
      - shell: bash
        run: |
          git config user.name "xau-bot"
          git config user.email "xau-bot@users.noreply.github.com"
          git add data/tracking/ 2>/dev/null || true
          git commit -q -m "outcomes: $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
