[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-signals"
version = "0.1.0"
description = "XAU/USD direction-and-entry notification system (session 09:00-15:00 IST), built from scratch."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
research = ["numpy>=1.26", "pandas>=2.1"]
dev = ["pytest>=8", "numpy>=1.26", "pandas>=2.1"]

[project.scripts]
xau-signals = "xau_signals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
